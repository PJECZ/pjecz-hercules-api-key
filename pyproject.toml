[project]
name = "pjecz-hercules-api-key"
version = "0.1.0"
description = "API del Poder Judicial del Estado de Coahuila de Zaragoza. Solicitudes a informatica en pjecz.gob.mx."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=49.0.0",
    "fastapi>=0.138.0",
    "fastapi-pagination>=0.15.15",
    "google-auth>=2.55.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.29.0",
    "google-cloud-storage>=3.12.0",
    "gunicorn>=26.0.0",
    "hashids>=1.3.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pytz>=2026.2",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
    "sqlmodel>=0.0.38",
    "unidecode>=1.4.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "faker>=40.23.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821"]
line-length = 128
