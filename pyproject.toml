[project]
name = "pjecz-hercules-api-key"
version = "0.1.0"
description = "API con autentificación para consultar la base de datos Plataforma Web."
authors = [
    {name = "Guillermo Valdes",email = "guillermo.valdes@pjecz.gob.mx"}
]
license = {text = "AGPL3"}
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "gunicorn (>=23.0.0,<24.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "unidecode (>=1.4.0,<2.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "cryptography (>=46.0.3,<47.0.0)",
    "hashids (>=1.3.1,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "sqlalchemy-utils (>=0.42.0,<0.43.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "fastapi (>=0.121.0,<0.122.0)",
    "fastapi-pagination (>=0.15.0,<0.16.0)",
    "google-auth (>=2.42.1,<3.0.0)",
    "google-cloud (>=0.34.0,<0.35.0)",
    "google-cloud-secret-manager (>=2.25.0,<3.0.0)",
    "google-cloud-storage (>=3.4.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
faker = "^37.12.0"
isort = "^7.0.0"
pre-commit = "^4.3.0"
pylint = "^4.0.2"
pylint-sqlalchemy = "^0.3.0"
pytest = "^8.4.2"
requests = "^2.32.5"

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"
