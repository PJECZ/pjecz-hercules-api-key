[project]
name = "pjecz-hercules-api-key"
version = "0.1.0"
description = "Hércules API-key."
readme = "README.md"
authors = [
    { name = "Guillermo Valdes", email = "guillermo.valdes@pjecz.gob.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "fastapi-pagination>=0.16.1",
    "google-auth>=2.62.0",
    "google-cloud>=0.34.0",
    "google-cloud-secret-manager>=2.31.0",
    "google-cloud-storage>=3.17.0",
    "gunicorn>=26.2.0",
    "hashids>=1.3.1",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pytz>=2026.5",
    "sqlalchemy>=2.1.4",
    "sqlalchemy-utils>=0.43.0",
    "unidecode>=1.4.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
pjecz-hercules-api-key = "pjecz_hercules_api_key:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 128

[tool.isort]
line_length = 128
profile = "black"

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportCallIssue = "hint"
reportMissingImports = "warning"
reportUndefinedVariable = "warning"
exclude = ["**/tests"]

[tool.ruff]
ignore = ["F821", "RUF012"]
line-length = 128
